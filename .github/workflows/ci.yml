name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache Nim toolchain and nimble packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.choosenim
            ~/.nimble
          key: nim-${{ runner.os }}-2.2.10-${{ hashFiles('scour.nimble') }}
          restore-keys: |
            nim-${{ runner.os }}-2.2.10-

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: "2.2.10"

      - name: Build
        run: nimble build -y

      - name: Test
        run: nimble test -y

      - name: Test distribution scripts
        run: bash tests/test_distribution.sh

      - name: Smoke test help
        run: ./scour --help

      - name: Smoke test version
        run: ./scour --version
