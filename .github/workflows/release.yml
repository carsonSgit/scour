name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, such as v0.2.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64, binary: scour }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, binary: scour }
          - { os: macos-15-intel, target: macos-x86_64, binary: scour }
          - { os: macos-14, target: macos-aarch64, binary: scour }
          - { os: windows-latest, target: windows-x86_64, binary: scour.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
      - name: Build release binary
        run: nimble build -d:release -y
      - name: Package Unix archive
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          mkdir package
          cp "${{ matrix.binary }}" README.md package/
          tar -czf "scour-${VERSION}-${{ matrix.target }}.tar.gz" -C package .
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item "${{ matrix.binary }}", README.md package/
          Compress-Archive -Path package/* -DestinationPath "scour-$env:VERSION-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: scour-${{ matrix.target }}
          path: scour-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum scour-* > "scour-${GITHUB_REF_NAME}-checksums.txt"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
