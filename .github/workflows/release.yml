name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: scour-linux-x86_64
            binary: scour
            archive: scour-linux-x86_64.tar.gz
          - os: macos-13
            asset: scour-macos-x86_64
            binary: scour
            archive: scour-macos-x86_64.tar.gz
          - os: macos-14
            asset: scour-macos-aarch64
            binary: scour
            archive: scour-macos-aarch64.tar.gz
          - os: windows-latest
            asset: scour-windows-x86_64
            binary: scour.exe
            archive: scour-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"

      - name: Build release binary
        run: nimble build -d:release -y

      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.asset }}
          cp ${{ matrix.binary }} dist/${{ matrix.asset }}/
          cp README.md dist/${{ matrix.asset }}/
          tar -czf dist/${{ matrix.archive }} -C dist ${{ matrix.asset }}

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.asset }}
          Copy-Item ${{ matrix.binary }} dist/${{ matrix.asset }}/
          Copy-Item README.md dist/${{ matrix.asset }}/
          Compress-Archive -Path dist/${{ matrix.asset }} -DestinationPath dist/${{ matrix.archive }}

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
