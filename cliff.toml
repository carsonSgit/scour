# git-cliff configuration — Conventional Commits -> keep-a-changelog style CHANGELOG.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This project adheres to [Semantic Versioning](https://semver.org).

"""
# tera template. `release.notes` is also reused (stripped) for GitHub release bodies.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}{% if commit.breaking %} **[breaking]**{% endif %}
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

# Map Conventional Commit prefixes to changelog sections.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^ci|^build", group = "Build & CI" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^revert", group = "Reverts" },
  { body = ".*security", group = "Security" },
  { message = ".*", group = "Other" },
]

# Don't show release commits / merge commits as changelog entries.
commit_preprocessors = []
